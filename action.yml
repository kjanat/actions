name: GitHub triage
description: Classify issues and pull requests and optionally apply the suggested triage.

inputs:
  typesafe-api-key:
    description: API key for the TypeSafe classifier. Defaults to the caller's TYPESAFE_API_KEY environment variable.
  token:
    description: GitHub token for the target repository. Falls back to the caller's GITHUB_TOKEN or GH_TOKEN, then github.token.
  target:
    description: GitHub issue or pull request URL or owner/repo#number. Defaults to the triggering item.
  labels:
    description: Optional JSON array of existing labels the classifier may consider.
  apply:
    description: Write the suggested changes to GitHub. Set to false to preview them.
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Deno
      uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      with: { deno-version: v2.x }
    - name: Set up Actions Shells
      uses: kjanat/actions-shells@v0
    - name: Triage issue or pull request
      shell: actions-shell deno {0}
      env:
        TRIAGE_INPUTS: ${{ toJSON(inputs) }}
        TRIAGE_EVENT_TARGET: ${{ format('{0}#{1}', github.repository, github.event.issue.number || github.event.pull_request.number) }}
        TRIAGE_CONTEXT_TOKEN: ${{ github.token }}
      run: |
        import { join, toFileUrl } from "jsr:@std/path@1";

        try {
          const actionPath = Deno.env.get("GITHUB_ACTION_PATH");
          if (!actionPath) throw new Error("GITHUB_ACTION_PATH is missing.");
          const { runAction } = await import(toFileUrl(join(actionPath, "triage.ts")).href);
          await runAction();
        } catch (error) {
          console.error(error instanceof Error ? error.message : String(error));
          Deno.exit(1);
        }
