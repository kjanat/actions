name: kprint fmt
description: format yo' shit
branding:
  icon: umbrella
  color: green
inputs:
  autofix:
    description: "autofix.ci compatible (does not fmt .github)"
    default: true
  version:
    description: "version of npm:@kjanat/fmt to run"
    default: "latest"

runs:
  # For more on composite actions, see:
  # https://docs.github.com/en/actions/sharing-automations/creating-actions/creating-a-composite-action
  using: composite
  steps:
    - id: greet
      shell: bash
      env:
        cmd: "--allow-no-files --diff ${{ case(inputs.autofix == 'true', '--excludes .github', '') }}"
        pkg: "${{ format('@kjanat/fmt@{0}', inputs.version) }}"
        NPM_CONFIG_TRUST_POLICY_IGNORE_AFTER: 0
      run: npx -y "${pkg}" ${{ env.cmd }} # actionlint:ignore script-interpolation
